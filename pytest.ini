[pytest]
testpaths = testy
python_files = test_*.py
python_functions = test_*
# `-m "not siec and not arkusz"` powtarza decyzje poprzednika. Dwa rodzaje
# testow NIE naleza do bramki domyslnej, bo ich czerwien nie mowi nic
# o naszym kodzie: `siec` odpytuje zywe strony rzadowe (uklad strony
# zmienia redakcja, nie my), `arkusz` czyta prawdziwy arkusz Darka
# z iCloud (plik zyje poza repozytorium). Uruchamia sie je osobno:
#   ./.venv/bin/python -m pytest testy/ -m siec
#   ./.venv/bin/python -m pytest testy/ -m arkusz
addopts = -q --strict-markers -m "not siec and not arkusz"
markers =
    siec: wymaga połączenia z internetem (API rządowe)
    baza: wymaga działającej bazy PostgreSQL
    arkusz: czyta prawdziwy arkusz z iCloud (pytest -m arkusz)
